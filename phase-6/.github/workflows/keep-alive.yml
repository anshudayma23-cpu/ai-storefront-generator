name: Daily Keep-Alive Ping

on:
  schedule:
    # Run once daily at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Keep-Alive Health Endpoint
        run: |
          APP_URL="${{ secrets.NEXT_PUBLIC_APP_URL || 'https://ai-storefront.vercel.app' }}"
          echo "Pinging $APP_URL/api/health..."
          curl -f -s "$APP_URL/api/health" || echo "Health ping executed"
